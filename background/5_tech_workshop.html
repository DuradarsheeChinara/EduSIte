<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TECH WORKSHOP</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@500;600;700&display=swap');
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #05070a;
    font-family: 'Georgia', 'Times New Roman', serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .frame {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 100vw;
    max-height: 100vh;
    aspect-ratio: 1672 / 941;
    overflow: hidden;
    box-shadow: 0 0 50px rgba(0,0,0,0.55);
    background: radial-gradient(ellipse at 50% -10%, #fdf6e3 0%, #f6e8c4 45%, #ecd9a8 100%);
  }
  .frame::before {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 100%, rgba(120,72,24,0.16) 0%, rgba(120,72,24,0) 55%),
                radial-gradient(ellipse at center, rgba(120,72,24,0) 55%, rgba(120,72,24,0.20) 100%),
                radial-gradient(ellipse at 50% 0%, rgba(120,72,24,0) 60%, rgba(120,72,24,0.12) 100%);
    pointer-events: none;
    z-index: 5;
  }
  .breathe {
    animation: breathe 14s ease-in-out infinite alternate;
  }
  @keyframes breathe {
    0%   { transform: scale(1.0); }
    100% { transform: scale(1.02); }
  }
  svg.layer {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  .title-wrap {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 6;
    width: 78%;
  }
  .eyebrow {
    font-family: 'Mukta', 'Trebuchet MS', sans-serif;
    letter-spacing: 6px;
    text-transform: uppercase;
    font-size: clamp(11px, 1.3vw, 16px);
    color: #7a5a2a;
    opacity: 0.9;
    margin-bottom: 10px;
    animation: fadeIn 2s ease-out;
  }
  .title {
    font-family: 'Baloo 2', 'Georgia', serif;
    font-size: clamp(30px, 5.4vw, 78px);
    color: #1b2c4d;
    font-weight: 700;
    letter-spacing: 1px;
    text-shadow: 0 2px 10px rgba(90,55,20,0.30), 0 0 26px rgba(168,70,31,0.45);
    animation: fadeIn 2.2s ease-out;
  }
  .rule {
    width: 130px;
    height: 3px;
    margin: 18px auto 0;
    background: linear-gradient(90deg, transparent, #a8461f, transparent);
    animation: fadeIn 2.6s ease-out;
  }
  .subtitle {
    margin-top: 14px;
    font-family: 'Mukta', 'Trebuchet MS', sans-serif;
    font-size: clamp(12px, 1.4vw, 18px);
    color: #7a5a2a;
    opacity: 0.85;
    letter-spacing: 1px;
    animation: fadeIn 3s ease-out;
  }
  @keyframes fadeIn {
    0% { opacity: 0; transform: translateY(8px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .sparkle {
    fill: #c9862a;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(0.7); }
    50% { opacity: 1; transform: scale(1.15); }
  }
  .wind-streak {
    stroke: rgba(120,72,24,0.28);
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
  }
</style>
</head>
<body>
<div class="frame" id="frame">
  <svg class="layer" id="bgLayer" viewBox="0 0 1672 941" preserveAspectRatio="none"></svg>
  <svg class="layer breathe" id="heroLayer" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid slice"></svg>
  <div class="title-wrap">
    <div class="eyebrow">Build  ·  Tinker  ·  Create</div>
    <div class="title">TECH WORKSHOP</div>
    <div class="rule"></div>
    <div class="subtitle">Where hands-on ideas take shape</div>
  </div>
  <svg class="layer" id="fxLayer" viewBox="0 0 1672 941" preserveAspectRatio="none"></svg>
</div>

<script>

const W = 1672, H = 941;
const bgLayer  = document.getElementById('bgLayer');
const heroLayer = document.getElementById('heroLayer');
const fxLayer  = document.getElementById('fxLayer');

function rand(min, max){ return Math.random() * (max - min) + min; }
function pick(arr){ return arr[Math.floor(rand(0, arr.length))]; }
function el(tag, attrs){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function textIcon(str, weight){
  return `<text x="0" y="0" text-anchor="middle" dominant-baseline="central"
           font-family="'Trebuchet MS', sans-serif" font-weight="${weight||800}"
           font-size="20" fill="currentColor">${str}</text>`;
}

/* ============ GENERIC PARTICLE ENGINE ============ */
function spawnParticle(cfg){
  const g = el('g', {class:'particle'});
  const inner = el('g', {});
  inner.innerHTML = (typeof cfg.iconMarkup === 'function') ? cfg.iconMarkup() : cfg.iconMarkup;
  const color = pick(cfg.colors);
  g.style.color = color;

  if (cfg.spin){
    inner.style.transformOrigin = 'center';
    inner.style.transformBox = 'fill-box';
    inner.style.animation = `spin ${rand(2.5,5)}s linear infinite ${Math.random()>0.5?'reverse':''}`;
  }
  if (cfg.flicker){
    inner.style.animation += `, flick ${rand(0.4,0.9)}s ease-in-out infinite alternate`;
  }
  g.appendChild(inner);

  const scale = rand(cfg.sizeRange[0], cfg.sizeRange[1]);
  fxLayer.appendChild(g);

  const motion = cfg.motion;
  let keyframes, duration;

  if (motion === 'rise'){
    const startX = rand(40, W-40);
    const sway = rand(-90, 90);
    const startY = H + 40, endY = -40;
    duration = rand(9, 16);
    keyframes = [
      { transform:`translate(${startX}px,${startY}px) scale(${scale}) rotate(0deg)`, opacity:0 },
      { transform:`translate(${startX+sway*0.4}px,${(startY+endY)/2}px) scale(${scale}) rotate(${rand(-20,20)}deg)`, opacity:1, offset:0.15 },
      { transform:`translate(${startX+sway*0.8}px,${endY+80}px) scale(${scale}) rotate(${rand(-20,20)}deg)`, opacity:1, offset:0.85 },
      { transform:`translate(${startX+sway}px,${endY}px) scale(${scale}) rotate(0deg)`, opacity:0 }
    ];
  } else if (motion === 'fall'){
    const startX = rand(-20, W+20);
    const drift = rand(150,380) * (Math.random()>0.5?1:-1);
    const startY = -40, endY = H+40;
    const spins = rand(1,4)*360*(Math.random()>0.5?1:-1);
    duration = rand(8, 14);
    keyframes = [
      { transform:`translate(${startX}px,${startY}px) scale(${scale}) rotate(0deg)`, opacity:0 },
      { transform:`translate(${startX+drift*0.3}px,${startY+80}px) scale(${scale}) rotate(${spins*0.2}deg)`, opacity:1, offset:0.12 },
      { transform:`translate(${startX+drift*0.8}px,${endY-100}px) scale(${scale}) rotate(${spins*0.8}deg)`, opacity:1, offset:0.85 },
      { transform:`translate(${startX+drift}px,${endY}px) scale(${scale}) rotate(${spins}deg)`, opacity:0 }
    ];
  } else { // across
    const dir = Math.random()>0.5 ? 1 : -1;
    const startX = dir===1 ? -60 : W+60;
    const endX = dir===1 ? W+60 : -60;
    const y = rand(70, H-140);
    const bob = rand(30,90);
    duration = rand(10, 18);
    keyframes = [
      { transform:`translate(${startX}px,${y}px) scale(${scale*dir},${scale}) rotate(0deg)`, opacity:0 },
      { transform:`translate(${(startX+endX)*0.3}px,${y-bob}px) scale(${scale*dir},${scale}) rotate(${dir*4}deg)`, opacity:1, offset:0.2 },
      { transform:`translate(${(startX+endX)*0.7}px,${y+bob*0.5}px) scale(${scale*dir},${scale}) rotate(${-dir*4}deg)`, opacity:1, offset:0.8 },
      { transform:`translate(${endX}px,${y}px) scale(${scale*dir},${scale}) rotate(0deg)`, opacity:0 }
    ];
  }

  const anim = g.animate(keyframes, { duration: duration*1000, easing:'ease-in-out', fill:'forwards' });
  anim.onfinish = () => g.remove();
}

const styleTag = document.createElement('style');
styleTag.textContent = `
  @keyframes spin { from { transform:rotate(0deg);} to { transform:rotate(360deg);} }
  @keyframes flick { 0% {opacity:0.4;} 100% {opacity:1;} }
`;
document.head.appendChild(styleTag);

const PARTICLE_TYPES = [
  { iconMarkup: (ICONS.gear), motion: 'rise', colors: ["#a8461f", "#c9622b"], sizeRange: [0.6, 1.2], spin: true, flicker: false },
  { iconMarkup: (ICONS.wrench), motion: 'fall', colors: ["#8a5a2a", "#b08355"], sizeRange: [0.6, 1.1], spin: false, flicker: false },
  { iconMarkup: (ICONS.spark), motion: 'rise', colors: ["#e0a53a", "#a8461f"], sizeRange: [0.4, 0.7], spin: false, flicker: true },
  { iconMarkup: (ICONS.bolt_nut), motion: 'across', colors: ["#b08355", "#8a5a2a"], sizeRange: [0.5, 0.9], spin: true, flicker: false }
];

function particleLoop(){
  const cfg = pick(PARTICLE_TYPES);
  spawnParticle(cfg);
  if (Math.random() > 0.5) setTimeout(()=>spawnParticle(pick(PARTICLE_TYPES)), rand(250,700));
  setTimeout(particleLoop, rand(500, 1100));
}
setTimeout(particleLoop, 300);

/* ============ WIND / AMBIENT STREAKS ============ */
function spawnWindGust(){
  const y = rand(100, H-60);
  const len = rand(90,220);
  const g = el('g', {});
  for (let i=0;i<3;i++){
    g.appendChild(el('path', {class:'wind-streak', d:`M0,${i*10} q ${len/2},-15 ${len},0`}));
  }
  const startX=-80;
  g.setAttribute('transform', `translate(${startX},${y})`);
  fxLayer.appendChild(g);
  const anim = g.animate([
    { transform:`translate(${startX}px,${y}px)`, opacity:0 },
    { transform:`translate(${startX+200}px,${y-rand(10,30)}px)`, opacity:0.7, offset:0.15 },
    { transform:`translate(${W-200}px,${y-rand(20,60)}px)`, opacity:0.7, offset:0.85 },
    { transform:`translate(${W+150}px,${y-rand(30,70)}px)`, opacity:0 }
  ], { duration: rand(3500,5500), easing:'ease-in-out', fill:'forwards' });
  anim.onfinish = () => g.remove();
}
function windLoop(){ spawnWindGust(); setTimeout(windLoop, rand(2800,5200)); }
setTimeout(windLoop, 1200);

function spawnSparkle(){
  const x = rand(0.72*W, 0.97*W), y = rand(0.04*H, 0.32*H);
  const s = el('circle', {class:'sparkle', cx:x, cy:y, r: rand(1.5,3.5)});
  s.style.animationDelay = rand(0,3)+'s';
  fxLayer.appendChild(s);
  setTimeout(()=> s.remove(), 6000);
}
setInterval(spawnSparkle, 650);


function mandalaSVG(cx, cy, r, color, opacity){
  opacity = opacity || 0.28;
  let petals = '';
  for (let i=0;i<12;i++){
    petals += `<g transform="rotate(${i*30})"><ellipse cx="0" cy="${-r*0.8}" rx="${r*0.09}" ry="${r*0.22}" fill="${color}" opacity="0.65"/></g>`;
  }
  let dots = '';
  for (let i=0;i<16;i++){
    dots += `<circle cx="0" cy="${-r*1.04}" r="2.1" transform="rotate(${i*22.5})" fill="${color}"/>`;
  }
  return `<g transform="translate(${cx},${cy})" opacity="${opacity}">
    <circle r="${r}" fill="none" stroke="${color}" stroke-width="1.3"/>
    <circle r="${r*0.68}" fill="none" stroke="${color}" stroke-width="0.9"/>
    <g>${petals}</g>
    <g>${dots}</g>
  </g>`;
}

/* ============ HERO ORNAMENTS (corner accents) ============ */
heroLayer.innerHTML = `
  ${mandalaSVG(W*0.90, H*0.15, W*0.075, '#e0a53a', 0.32)}
  <g transform="translate(${W*0.90},${H*0.15}) scale(5)" opacity="0.55" style="color:#a8461f">
