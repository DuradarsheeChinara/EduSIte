    0%   { transform: scale(1.0); }
    100% { transform: scale(1.025); }

  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 82% 10%, rgba(255,235,170,0.4) 0%, rgba(255,235,170,0) 24%);
    pointer-events: none;
  }

  .suglow {
    position: absolute;
    top: 5%; right: 6%;
    width: 8%; padding-top: 8%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,220,120,0.6) 0%, rgba(255,220,120,0.0) 70%);
    animation: pulseglow 4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes pulseglow {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50% { opacity: 0.85; transform: scale(1.1); }
  }

  svg.layer {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  .wingL, .wingR {
    transform-box: fill-box;
    transform-origin: 100% 50%;
    animation: flapL 0.55s ease-in-out infinite alternate;
  }
  .wingR { animation-name: flapR; }
  @keyframes flapL {
    0%   { transform: rotate(-8deg); }
    100% { transform: rotate(38deg); }
  }
  @keyframes flapR {
    0%   { transform: rotate(8deg); }
    100% { transform: rotate(-38deg); }
  }

  .wind-streak {
    stroke: rgba(255,255,255,0.5);
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
  }

  .sparkle {
    fill: #ffcf6b;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.7); }
    50% { opacity: 1; transform: scale(1.15); }
  }
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="bg"></div>
  <div class="glow"></div>
  <div class="suglow"></div>
  <svg class="layer" id="svgLayer" viewBox="0 0 1672 941" preserveAspectRatio="none"></svg>
</div>

<script>
const svg = document.getElementById('svgLayer');
const NS = "http://www.w3.org/2000/svg";
const W = 1672, H = 941;

function rand(min, max){ return Math.random() * (max - min) + min; }
function el(tag, attrs){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

/* ---------------- BIRDS (Indian folk-art style, small colourful birds) ---------------- */
const PALETTES = [
  { body:'#3f9c6b', wing:'#2f7d52', belly:'#e0a63a', beak:'#d9542b', name:'parrot' },   // green parrot, orange beak
  { body:'#2f7f8f', wing:'#1f5f6c', belly:'#e8b23c', beak:'#e0672b', name:'kingfisher' },// teal kingfisher
  { body:'#a05a2c', wing:'#7c421c', belly:'#e8c877', beak:'#d99a2b', name:'myna' },      // brown myna
  { body:'#c9622b', wing:'#a24a1f', belly:'#f4d18a', beak:'#7a3a12', name:'bulbul' }     // rust bulbul
];

const wingShape = 'M0,0 C -9,-13 -23,-16 -39,-7 C -33,-2 -24,3 -9,4 C -5,2 -2,1 0,0 Z';

function makeBird(scale, pal){
  const g = el('g', {class:'bird'});

  // tail feathers
  const tail = el('path', {
    d:'M-11,1 L-24,-5 L-22,1 L-24,7 Z',
    fill: pal.wing
  });

  // body
  const body = el('ellipse', {cx:0, cy:0, rx:11, ry:5.5, fill: pal.body});
  const belly = el('ellipse', {cx:1, cy:2.5, rx:7, ry:2.6, fill: pal.belly, opacity:0.85});

  // head + beak
  const head = el('circle', {cx:13, cy:-3.5, r:5, fill: pal.body});
  const beak = el('path', {d:'M17.5,-3.5 L24,-1.5 L17.5,0.3 Z', fill: pal.beak});
  const eye = el('circle', {cx:14.5, cy:-4.5, r:0.8, fill:'#1c1208'});

  // wings (pivot at shoulder, rotate to flap)
  const wingL = el('g', {class:'wingL'});
  wingL.appendChild(el('path', {d: wingShape, fill: pal.wing}));
  wingL.setAttribute('transform', 'translate(-2,-2)');

  const wingR = el('g', {class:'wingR'});
  const wingRPath = el('path', {d: wingShape, fill: pal.wing});
  wingR.appendChild(wingRPath);
  wingR.setAttribute('transform', 'translate(2,-2) scale(-1,1)');

  g.appendChild(tail);
  g.appendChild(body);
  g.appendChild(belly);
  g.appendChild(wingL);
  g.appendChild(wingR);
  g.appendChild(head);
  g.appendChild(beak);
  g.appendChild(eye);

  g.setAttribute('transform', `scale(${scale})`);
  return g;
}

function spawnBird(){
  const pal = PALETTES[Math.floor(rand(0, PALETTES.length))];
  const scale = rand(0.9, 1.8);
  const startY = rand(50, 320);
  const endY = startY + rand(-70, 70);
  const dir = Math.random() > 0.5 ? 1 : -1;
  const duration = rand(9, 15);

  const wrap = el('g', {});
  const bird = makeBird(scale, pal);
  wrap.appendChild(bird);
  svg.appendChild(wrap);

  const startX = dir === 1 ? -60 : W + 60;
  const endX = dir === 1 ? W + 60 : -60;

  const anim = wrap.animate([
    { transform: `translate(${startX}px, ${startY}px) scale(${dir},1)` },
    { transform: `translate(${(startX+endX)/2}px, ${Math.min(startY,endY)-rand(20,60)}px) scale(${dir},1)` },
    { transform: `translate(${endX}px, ${endY}px) scale(${dir},1)` }
  ], { duration: duration * 1000, easing: 'ease-in-out', fill: 'forwards' });

  anim.onfinish = () => { wrap.remove(); };
}

function birdLoop(){
  spawnBird();
  if (Math.random() > 0.55) setTimeout(spawnBird, rand(300, 900));
  setTimeout(birdLoop, rand(1800, 3600));
}
setTimeout(birdLoop, 400);

/* ---------------- LEAVES ---------------- */
function makeLeafPath(color){
  return el('path', {
    class:'leaf',
    d:'M0,-9 C 6,-9 10,-3 10,2 C 10,7 5,10 0,12 C -5,10 -10,7 -10,2 C -10,-3 -6,-9 0,-9 Z M0,-8 L0,11',
    fill: color,
    stroke: 'rgba(90,50,10,0.35)',
    'stroke-width': 0.6
  });
}

function spawnLeaf(){
  const colors = ['#c9622b','#dd7a2e','#8f9c3f','#b0862f','#a94a2b','#7f9a3d'];
  const color = colors[Math.floor(rand(0,colors.length))];
  const scale = rand(0.5, 1.15);
  const startX = rand(-40, W + 40);
  const startY = -30;
  const endY = H + 40;
  const drift = rand(180, 420) * (Math.random() > 0.5 ? 1 : -1);
  const duration = rand(7, 13);
  const spins = rand(2, 6) * (Math.random() > 0.5 ? 1 : -1) * 360;

  const g = el('g', {});
  const leaf = makeLeafPath(color);
  g.appendChild(leaf);
  g.setAttribute('transform', `translate(${startX},${startY}) scale(${scale}) rotate(0)`);
  svg.appendChild(g);

  const midX = startX + drift * 0.5;
  const endX = startX + drift;

  const anim = g.animate([
    { transform: `translate(${startX}px, ${startY}px) rotate(0deg) scale(${scale})` },
    { transform: `translate(${midX}px, ${(startY+endY)/2}px) rotate(${spins*0.5}deg) scale(${scale})` },
    { transform: `translate(${endX}px, ${endY}px) rotate(${spins}deg) scale(${scale})` }
  ], { duration: duration * 1000, easing: 'ease-in-out', fill: 'forwards' });

  anim.onfinish = () => { g.remove(); };
}

function leafLoop(){
  spawnLeaf();
  setTimeout(leafLoop, rand(450, 1100));
}
setTimeout(leafLoop, 200);

/* ---------------- WIND GUST STREAKS ---------------- */
function spawnWindGust(){
  const y = rand(100, H - 60);
  const startX = -80;
  const len = rand(90, 220);
  const g = el('g', {});
  for (let i = 0; i < 3; i++){
    const path = el('path', { class: 'wind-streak', d: `M0,${i*10} q ${len/2},-15 ${len},0` });
    g.appendChild(path);
  }
  g.setAttribute('transform', `translate(${startX}, ${y})`);
  svg.appendChild(g);

  const anim = g.animate([
    { transform: `translate(${startX}px, ${y}px)`, opacity: 0 },
    { transform: `translate(${startX + 200}px, ${y - rand(10,30)}px)`, opacity: 0.8, offset: 0.15 },
    { transform: `translate(${W - 200}px, ${y - rand(20,60)}px)`, opacity: 0.8, offset: 0.85 },
    { transform: `translate(${W + 150}px, ${y - rand(30,70)}px)`, opacity: 0 }
  ], { duration: rand(3500, 5500), easing: 'ease-in-out', fill: 'forwards' });
  anim.onfinish = () => g.remove();
}

function windLoop(){
  spawnWindGust();
  setTimeout(windLoop, rand(2500, 5000));
}
setTimeout(windLoop, 1000);

/* ---------------- AMBIENT SPARKLES near the sun ---------------- */
function spawnSparkle(){
  const cx = W * 0.885, cy = H * 0.135;
  const x = cx + rand(-90, 90);
  const y = cy + rand(-90, 90);
  const s = el('circle', {class:'sparkle', cx:x, cy:y, r: rand(1.5,3.5)});
  s.style.animationDelay = rand(0,3)+'s';
  svg.appendChild(s);
  setTimeout(()=> s.remove(), 6000);
}
setInterval(spawnSparkle, 700);

</script>
